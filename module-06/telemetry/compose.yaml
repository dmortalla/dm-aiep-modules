# Module 6 local operational telemetry stack. Local review only.
#
# Path: application OTLP/HTTP -> OpenTelemetry Collector -> Prometheus -> Grafana.
# Every published port binds to 127.0.0.1. Nothing here provides hosted
# authentication or TLS; do not publish these ports beyond loopback.
#
#   docker compose -f module-06/telemetry/compose.yaml up -d
#   docker compose -f module-06/telemetry/compose.yaml down --volumes
name: module6-telemetry

x-hardening: &hardening
  restart: "no"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  otel-collector:
    <<: *hardening
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    read_only: true
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # OTLP/HTTP receiver only. The Prometheus exposition port 8889 and all
      # collector extension ports stay on the private Compose network.
      - "127.0.0.1:${MODULE6_OTLP_PORT:-4318}:4318"
    mem_limit: 192m
    cpus: 0.5

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=256MB
      - --web.listen-address=0.0.0.0:9090
    read_only: true
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${MODULE6_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 384m
    cpus: 0.5

  grafana:
    <<: *hardening
    image: grafana/grafana:12.4.12
    environment:
      # Read-only anonymous viewing for a loopback review stack. Login, basic
      # auth and sign-up are disabled, so no password exists in source and the
      # built-in admin account cannot be used. This is not hosted access control.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No outbound calls: usage reporting, update checks, news and plugin
      # catalogue are disabled.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 10s
      GF_DATAPROXY_TIMEOUT: "10"
      GF_LOG_LEVEL: warn
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs:
      # Dashboards and the datasource are provisioned from source, so Grafana
      # keeps no state between runs.
      - /var/lib/grafana:size=128m,uid=472,gid=0
    ports:
      - "127.0.0.1:${MODULE6_GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.5

volumes:
  prometheus-data: {}
