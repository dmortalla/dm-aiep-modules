[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-aiep-modules"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "google-genai>=2.26.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "openai>=3.22.1",
    "pinecone>=10.0.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
# Module 1 queue tests retain their existing direct import from test_service.
pythonpath = ["module-01/src", "module-02/src", "module-03/src", "module-01/tests"]
testpaths = ["module-01/tests", "module-02/tests", "module-03/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true

[tool.setuptools]
package-dir = { ai_engineering_foundations = "module-01/src/ai_engineering_foundations", prompt_engineering_systems = "module-02/src/prompt_engineering_systems", rag_engineering_foundations = "module-03/src/rag_engineering_foundations" }

[tool.setuptools.packages.find]
where = ["module-01/src", "module-02/src", "module-03/src"]
include = ["ai_engineering_foundations*", "prompt_engineering_systems*", "rag_engineering_foundations*"]
namespaces = false
